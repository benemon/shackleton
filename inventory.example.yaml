# Operator-declared inventory. Place one or more YAML files like this in
# inventory_dir; they are merged in file-name order. The inventory is a
# security boundary: gated host commands are validated against the declared
# hosts before any approval is requested, and it never holds credentials.
#
# Discovery: once at least one host or cluster is declared, the daemon
# periodically queries each metrics source for node-exporter hosts via
# node_uname_info and proposes unknown ones as drafts in machine-owned
# drafts.yaml. Drafts are inert — listed in /v1/inventory and the console, but
# excluded from the prompt and from gating — until approved: set
# status: approved in place, or move the entry into a file like this one.
# Set status: ignored to keep an unwanted standalone proposal inert and stop
# it being proposed again. Kube nodes observed in kube_node_info are never
# proposed as standalone hosts. With exactly one declared cluster they are
# recorded in fully machine-owned cluster-nodes.yaml; otherwise attribution
# is skipped.
# Prompt and gating pick the approval up at the next daemon restart.
hosts:
  # Canonical connection target. Alert and metric identities matching name,
  # hostname, or any alias (with or without a :port suffix) resolve here.
  - name: alpha
    hostname: alpha.example.internal
    aliases: [alpha-storage]
    # Connection mechanism only: ssh (default) or winrm.
    connection: ssh
  - name: beta
    hostname: beta.example.internal
clusters:
  - name: prod
    # Cluster API endpoint, for the record; cluster access itself stays with
    # the configured MCP servers.
    api: https://api.prod.example.internal:6443
    # kubernetes or openshift (the vocabulary differs).
    type: openshift
