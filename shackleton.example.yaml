# Address for the API listener.
listen: "127.0.0.1:8420"
# Optional TLS for the listener; both files or neither.
tls:
  # PEM-encoded server certificate (leaf first, then intermediates).
  cert_file: /etc/shackleton/tls.crt
  # PEM-encoded private key.
  key_file: /etc/shackleton/tls.key
# Environment variable containing the API bearer token.
api_token: {env: SHACKLETON_API_TOKEN}
# Directory containing investigation audit state.
state_dir: /var/lib/shackleton
# Dotenv files loaded before secret references are resolved.
env_files: [/etc/shackleton/env]
model:
  # OpenAI-compatible model API base URL.
  base_url: https://model.example.invalid/v1
  # Model identifier sent with completion requests.
  name: example-model
  # Environment variable containing the model API key.
  api_key: {env: OPENAI_API_KEY}
mcp_servers:
  # Name used to identify this MCP server in errors.
  - name: host-remediation
    # Streamable HTTP MCP endpoint.
    url: http://127.0.0.1:8100/mcp
    # Optional environment variable containing the complete Authorization header.
    auth_header: {env: MCP_AUTH_HEADER}
# Named metrics query APIs, each registering query_<name>_instant and
# query_<name>_range. Optional; type prometheus covers any
# Prometheus-compatible endpoint (Prometheus, Thanos, Mimir, Victoria).
metrics_sources:
  - name: prometheus
    type: prometheus
    url: https://prometheus.example.invalid
    # Optional complete Authorization header. Prefer a file reference for
    # short-TTL credentials: file-backed secrets are re-read on every
    # request, so a rotation agent can renew the file under the running
    # daemon.
    auth_header: {file: /etc/shackleton/prometheus-auth}
# Named log query APIs, each registering query_<name>_logs. Optional; type
# loki covers any Loki-compatible endpoint.
logs_sources:
  - name: loki
    type: loki
    url: https://loki.example.invalid
    auth_header: {env: LOKI_AUTH_HEADER}
# MCP tool names that require operator approval.
gated_tools: [run_host_command, run_kubectl_command]
# Unprivileged delivery channels: sweep verdicts and answers out, Q&A in.
notifications:
  - name: ops
    type: telegram
    bot_token: {env: TG_BOT_TOKEN}
    chat_id: {env: TG_CHAT_ID}
# Privileged channels: Approve/Deny buttons for gated tool calls. May share
# credentials with a notifications channel, or use a separate bot or chat to
# keep the approving audience smaller. With telegram, channels sharing a bot
# token are served by one poller (Telegram allows a single getUpdates
# consumer per token).
approvals:
  - name: approvers
    type: telegram
    bot_token: {env: TG_BOT_TOKEN}
    chat_id: {env: TG_APPROVALS_CHAT_ID}
sweeps:
  # Name used in the investigation trigger and notifications.
  - name: node-fs
    # Standard five-field cron expression.
    schedule: "0 */4 * * *"
    # Question posed to the model; a structured-verdict instruction is appended.
    question: Check node filesystem pressure and report any host above 80% used.
agent:
  # Operator-authored preamble describing the estate the agent investigates:
  # its role, the topology, where measurements live. Appended to it are the
  # fixed behavioral rules (metrics tool usage, gated-tool discipline, denial
  # reporting), with gated tool names taken from gated_tools above.
  prompt: >-
    You are an infrastructure investigation agent for a small estate. The
    estate is three bare-metal hosts named alpha, beta, and gamma running
    services via systemd. Every numeric host measurement lives in Prometheus
    via node-exporter and is keyed by the instance label.
  # Maximum model completion rounds per investigation.
  max_rounds: 8
  # Cap on a single tool result entering the model conversation; larger
  # results are truncated with a marker asking the model to narrow the
  # query. Size to the model's context window.
  max_tool_result_chars: 30000
  # Timeout applied to each individual tool call.
  call_timeout: 30s
  # Wall-clock limit for a complete investigation.
  investigation_timeout: 10m
